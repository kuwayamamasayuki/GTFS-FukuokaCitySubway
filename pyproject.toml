[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fukuoka-gtfs"
version = "1.0.0"
description = "福岡市地下鉄 時刻表Excel → GTFS-JP 静的データ生成"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "openpyxl>=3.1",
    "xlrd==2.0.1",
    "PyYAML>=6",
    "pydantic>=2",
    "requests>=2",
    "jpholiday>=0.1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-playwright>=0.5"]

[project.scripts]
fukuoka-gtfs = "fukuoka_gtfs.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = [
    "gui: ブラウザ(Playwright/Chromium)を要する GUI テスト。`make test` では除外し、Chromium 未導入なら自動 skip。",
]
