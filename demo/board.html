<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>発車標・時刻表ビューア — 福岡市地下鉄 GTFS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho+B1:wght@600;700&family=Zen+Kaku+Gothic+New:wght@400;500;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<style>
  main{ position:relative; z-index:1; max-width:1180px; margin:0 auto; padding:24px clamp(16px,4vw,44px) 80px;
        display:grid; grid-template-columns:280px 1fr; gap:24px; }
  @media (max-width:820px){ main{ grid-template-columns:1fr; } }

  /* 左: 駅リスト */
  .rail{ background:var(--panel); border:1px solid var(--line); border-radius:16px; padding:14px; align-self:start;
         position:sticky; top:78px; max-height:calc(100vh - 100px); overflow:auto; }
  .rail h4{ font-family:var(--font-mono); font-size:11px; letter-spacing:.2em; color:var(--muted); margin:14px 8px 6px; }
  .rail .grp:first-child h4{ margin-top:4px; }
  .rail button{ display:flex; align-items:center; gap:9px; width:100%; text-align:left; background:none; border:none;
    color:var(--ink); font-family:var(--font-ui); font-size:14px; padding:7px 9px; border-radius:9px; cursor:pointer; transition:.12s;}
  .rail button:hover{ background:var(--panel-2); }
  .rail button.on{ background:#0a0e15; box-shadow:inset 0 0 0 1px var(--line); }
  .rail button .c{ font-family:var(--font-mono); font-size:10px; color:var(--muted); margin-left:auto; }

  /* 右: 発車標 */
  .board{ background:linear-gradient(180deg,#0b0f17,#080b11); border:1px solid var(--line); border-radius:18px;
          overflow:hidden; box-shadow:0 30px 80px -40px #000; }
  .bhead{ padding:22px 26px; border-bottom:1px solid var(--line); display:flex; align-items:flex-end; gap:16px; flex-wrap:wrap; }
  .bhead .name{ font-family:var(--font-display); font-size:clamp(28px,4vw,42px); font-weight:700; line-height:1; }
  .bhead .en{ font-family:var(--font-mono); font-size:12px; letter-spacing:.25em; color:var(--muted); margin-bottom:6px; }
  .bhead .code{ font-family:var(--font-mono); font-size:12px; padding:3px 9px; border:1px solid var(--line); border-radius:6px; color:var(--muted); }
  .bhead .now{ margin-left:auto; font-family:var(--font-mono); text-align:right; }
  .bhead .now .big{ font-size:30px; text-shadow:0 0 22px rgba(0,174,239,.4); }
  .bhead .now .l{ font-size:10px; letter-spacing:.3em; color:var(--muted); }

  .ctl{ display:flex; align-items:center; gap:14px; padding:14px 26px; border-bottom:1px solid var(--line); flex-wrap:wrap; }
  .tabs{ display:flex; gap:3px; background:#0a0e15; border:1px solid var(--line); border-radius:999px; padding:3px;}
  .tabs button{ font-size:12.5px; color:var(--muted); background:none; border:none; cursor:pointer; padding:6px 14px; border-radius:999px;}
  .tabs button.on{ background:var(--panel); color:var(--ink);}
  .ctl .slid{ display:flex; align-items:center; gap:10px; flex:1; min-width:180px; font-family:var(--font-mono); font-size:11px; color:var(--muted);}
  .ctl .slid input{ flex:1; -webkit-appearance:none; appearance:none; height:4px; border-radius:3px; background:#243244;}
  .ctl .slid input::-webkit-slider-thumb{ -webkit-appearance:none; width:14px;height:14px;border-radius:50%;background:var(--hako);box-shadow:0 0 10px rgba(0,174,239,.6);cursor:pointer;}
  .lang{ display:flex; gap:3px; background:#0a0e15; border:1px solid var(--line); border-radius:999px; padding:3px;}
  .lang button{ font-family:var(--font-mono); font-size:11px; color:var(--muted); background:none;border:none;cursor:pointer;padding:6px 12px;border-radius:999px;}
  .lang button.on{ background:var(--panel); color:var(--ink);}

  /* 行 */
  .rows{ }
  .row{ display:grid; grid-template-columns:108px 1fr auto 84px; align-items:center; gap:16px;
        padding:15px 26px; border-bottom:1px solid #121a26; opacity:0; transform:translateY(6px);
        animation:flip .4s forwards; }
  @keyframes flip{ to{ opacity:1; transform:none; } }
  .row .time{ font-family:var(--font-mono); font-size:27px; font-weight:500; letter-spacing:.02em; }
  .row .dest .ja{ font-size:17px; } .row .dest .en{ font-family:var(--font-mono); font-size:11px; color:var(--muted); letter-spacing:.1em; }
  .row .ln{ font-size:12.5px; display:inline-flex; align-items:center; gap:7px; }
  .row .ln .dot{ width:9px;height:9px;border-radius:50%; box-shadow:var(--glow) currentColor;}
  .row .cd{ font-family:var(--font-mono); font-size:12px; color:var(--muted); text-align:right; }
  .row .cd b{ color:var(--kuko); font-size:15px; }
  .empty{ padding:50px 26px; text-align:center; color:var(--muted); }
  .dir{ font-family:var(--font-mono); font-size:11px; color:var(--faint); }
</style>
</head>
<body>
<header class="topbar">
  <div class="brand">福岡市地下鉄 <small>DEPARTURES</small></div>
  <nav>
    <a href="index.html">概要</a>
    <a href="map.html">運行マップ</a>
    <a href="board.html" class="active">発車標</a>
  </nav>
</header>

<main>
  <aside class="rail" id="rail"></aside>
  <section class="board">
    <div class="bhead">
      <div>
        <div class="en" id="b-en">—</div>
        <div class="name" id="b-name">駅を選択</div>
      </div>
      <span class="code" id="b-code"></span>
      <div class="now"><div class="big" id="b-now">08:00</div><div class="l" id="b-nowl">NOW（基準時刻）</div></div>
    </div>
    <div class="ctl">
      <div class="tabs" id="svtabs"></div>
      <div class="lang" id="lang"><button data-l="ja" class="on">日本語</button><button data-l="en">EN</button></div>
      <div class="slid">05:00<input type="range" id="now" min="300" max="1500" value="480">25:00</div>
    </div>
    <div class="rows" id="rows"><div class="empty">左の一覧から駅を選んでください。</div></div>
  </section>
</main>

<script>
const SERVICES=["平日","土曜","休日"];
const SVLABEL={"平日":"平日","土曜":"土曜","休日":"休日"};
let net, dep, enMap={}, cur=null, service="平日", lang="ja", nowMin=480;

Promise.all([fetch("data/network.json").then(r=>r.json()), fetch("data/departures.json").then(r=>r.json())])
  .then(([n,d])=>{ net=n; dep=d; net.lines.forEach(l=>l.stations.forEach(s=>enMap[s.name]=s.name_en)); init();})
  .catch(()=>{ document.getElementById("rows").innerHTML='<div class="empty">data/*.json を読み込めません。ローカルサーバで開いてください（README 参照）。</div>'; });

function fmt(min){ const h=Math.floor(min/60), m=min%60; return String(h).padStart(2,"0")+":"+String(m).padStart(2,"0"); }
function enName(ja){ return enMap[ja] || ja; }   // JR 直通先など未収録はそのまま

function init(){
  // 左レール（路線ごとに駅）
  const rail=document.getElementById("rail");
  net.lines.forEach(l=>{
    const g=document.createElement("div"); g.className="grp";
    g.innerHTML=`<h4 style="color:${l.color}">${l.name}　${l.name_en.toUpperCase()}</h4>`;
    l.stations.forEach(s=>{
      const b=document.createElement("button"); b.dataset.id=s.id;
      b.innerHTML=`<span style="display:inline-block;width:8px;height:8px;border-radius:50%;background:${l.color};box-shadow:var(--glow) ${l.color}"></span>${s.name}<span class="c">${s.code.split('/')[0]}</span>`;
      b.onclick=()=>select(s.id);
      g.appendChild(b);
    });
    rail.appendChild(g);
  });
  // 区分タブ
  const tabs=document.getElementById("svtabs");
  SERVICES.forEach(sv=>{ const b=document.createElement("button"); b.textContent=SVLABEL[sv]; if(sv===service)b.className="on";
    b.onclick=()=>{ service=sv; [...tabs.children].forEach(c=>c.classList.toggle("on",c.textContent===SVLABEL[sv])); render();}; tabs.appendChild(b);});
  // 言語
  document.getElementById("lang").addEventListener("click",e=>{ const b=e.target.closest("button"); if(!b)return;
    lang=b.dataset.l; [...e.currentTarget.children].forEach(c=>c.classList.toggle("on",c===b)); render();});
  // 時刻
  const nw=document.getElementById("now");
  nw.oninput=()=>{ nowMin=+nw.value; document.getElementById("b-now").textContent=fmt(nowMin); render();};

  // 既定で博多（id 11）を選択（七隈線・空港線の乗換駅）
  select("11");
}

function select(id){
  cur=id;
  document.querySelectorAll(".rail button").forEach(b=>b.classList.toggle("on", b.dataset.id===id));
  const s=dep[id];
  document.getElementById("b-name").textContent = lang==="en" ? s.name_en : s.name;
  document.getElementById("b-en").textContent = (s.name_en||"").toUpperCase();
  document.getElementById("b-code").textContent = s.code;
  render();
}

function render(){
  if(!cur) return;
  const s=dep[cur];
  document.getElementById("b-name").textContent = lang==="en" ? s.name_en : s.name;
  const nowSec=nowMin*60;
  const list=(s[service]||[]).filter(d=>d.t>=nowSec).slice(0,14);
  const rows=document.getElementById("rows");
  if(!list.length){ rows.innerHTML=`<div class="empty">この時刻以降の発車はありません（${SVLABEL[service]}）。</div>`; return; }
  rows.innerHTML="";
  list.forEach((d,i)=>{
    const min=Math.round((d.t-nowSec)/60);
    const cd = min<=0 ? "<b>まもなく</b>" : `<b>${min}</b>分`;
    const destJa=d.headsign, destEn=enName(d.headsign);
    const r=document.createElement("div"); r.className="row"; r.style.animationDelay=(i*0.03)+"s";
    r.innerHTML=`
      <div class="time" style="color:${d.color}">${d.hhmm}</div>
      <div class="dest"><div class="ja">${lang==="en"?destEn:destJa} ${lang==="en"?"":""}</div>
        <div class="en">${lang==="en"?destJa:destEn} ・ ${d.route}</div></div>
      <div class="ln" style="color:${d.color}"><span class="dot" style="background:${d.color}"></span>
        <span style="color:var(--ink)">${d.route}</span></div>
      <div class="cd">${cd}</div>`;
    rows.appendChild(r);
  });
}
</script>
</body>
</html>
