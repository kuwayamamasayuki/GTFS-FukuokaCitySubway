# 共用駅のホーム（子 stop）割当の特例。
# 通常駅は dir0→"{親id}_1" / dir1→"{親id}_2" を自動採用するため記載不要。
# 駅名↔stop_id↔所属路線は reference_gtfs/stops.txt から自動推定される
# （stop_code の接頭字 K=空港線 / H=箱崎線 / N=七隈線）。
platform_overrides:
  "9":   # 中洲川端（K09 / H01）— 路線ごとに別ホーム
    空港線: {0: "9_3", 1: "9_4"}
    箱崎線: {0: "9_1", 1: "9_2"}
  "11":  # 博多 — 空港線ホームは 11 配下(_1/_2)、七隈線ホームは独立駅 37 配下(37_3/37_4)。
         # 七隈線博多(id 37)は空港線博多(id 11)と物理的に別位置で別座標(Issue #53)。
         # 名前解決(parent_id「博多」)は共用ジャンクションの 11 が担うため、ここのキーは "11"
         # のまま 37_3/37_4 を返す。理由は docs/design/hakata-nanakuma-station.md を参照。
    空港線: {0: "11_1", 1: "11_2"}
    七隈線: {0: "37_3", 1: "37_4"}
