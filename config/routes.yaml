# シート名の語彙 → GTFS の運行区分 / 方向。
# 部分一致で判定するので、シート名の体裁が多少変わっても耐える。

# 運行区分語 → service_id（calendar.yaml の services と対応）
service_labels:
  平日: 平日
  土曜: 土曜
  休日: 休日

# 方面語 → direction_id（事業者全体で一意になるように割り当て）
#   空港線/箱崎線: 0=空港・貝塚方面 / 1=姪浜方面
#   七隈線:        0=博多方面       / 1=橋本方面
directions:
  空港貝塚方面: 0
  姪浜方面: 1
  博多方面: 0
  橋本方面: 1
