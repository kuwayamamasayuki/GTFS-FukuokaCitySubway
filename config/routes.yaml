# シート名の語彙 → GTFS の運行区分 / 方向。
# 部分一致で判定するので、シート名の体裁が多少変わっても耐える。

# 運行区分語 → service_id（calendar.yaml の services と対応）
service_labels:
  平日: 平日
  土曜: 土曜
  休日: 休日

# 方面語 → direction_id（事業者全体で一意になるように割り当て）
#   空港線/箱崎線: 0=空港・貝塚方面 / 1=姪浜方面
#   七隈線:        0=博多方面       / 1=橋本方面
directions:
  空港貝塚方面: 0
  姪浜方面: 1
  博多方面: 0
  橋本方面: 1

# (route_id, direction_id) → shape_id。trips.txt の shape_id 列に充てる（Issue #48）。
# direction_id の方面割り当ては上の directions と同一（0=空港/貝塚/博多方面, 1=姪浜/橋本方面）。
# 値は shapes.txt の shape_id と完全一致させること。shape 名の「○○方面行き」は線形の
# 終点側を指すため、directions の方面語とは綴りが異なる場合がある
# （例: dir0 空港線=「福岡空港方面行き」、dir0 七隈線=「博多方面行き」。七隈線 dir0 は
# 2023 年の博多延伸で終点が博多になったため shape_id も「博多方面行き」。Issue #48/#55）。
trip_shapes:
  空港線:
    0: 空港線（福岡空港方面行き）
    1: 空港線（姪浜方面行き）
  箱崎線:
    0: 箱崎線（貝塚方面行き）
    1: 箱崎線（中洲川端方面行き）
  七隈線:
    0: 七隈線（博多方面行き）
    1: 七隈線（橋本方面行き）
