# ジョルダンの発着・料金検索と生成 GTFS の運賃突合（Issue #10 運賃確認テスト用）。
#
# ジョルダンの料金検索結果ページ(nsresult)は JS 駆動のため、フィクスチャ
# (tests/fixtures/jorudan_fares.json) は scripts/fetch_jorudan_fares.py が
# ヘッドレスブラウザ(Playwright)で一度だけ取得して生成する。テスト自体はその
# フィクスチャを読むだけでネットワークに依存しない。

# 取得に用いる代表日時（dt=YYYYMMDDHHMM）。運賃は日時に依存しないため任意の平日昼。
sample_dt: "202606011030"

# 既知の運賃相違を許容するペア（"<o>-<d>"、stop_id を昇順）。原則 0 件。
# ジョルダンと GTFS が真に食い違う場合のみ、根拠コメント付きで登録する。
# （実データの誤りを隠さないため、安易に追加しない。）
allow: []
