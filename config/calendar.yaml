# 運行区分（曜日パターン）と、路線グループごとの有効期間。
# Excel は 平日 / 土曜 / 休日 の 3 区分に分かれる。
services:
  平日: {monday: 1, tuesday: 1, wednesday: 1, thursday: 1, friday: 1, saturday: 0, sunday: 0}
  土曜: {monday: 0, tuesday: 0, wednesday: 0, thursday: 0, friday: 0, saturday: 1, sunday: 0}
  休日: {monday: 0, tuesday: 0, wednesday: 0, thursday: 0, friday: 0, saturday: 0, sunday: 1}

# 路線グループごと、さらに区分（平日/土曜/休日）ごとに有効期間の開始日を分ける。
# service_id は "<id>_<区分>"（例: 空港箱崎_平日）。GTFS では有効期間は service_id 単位なので、
# start_dates で区分ごとの改正日（start_date）を独立して持たせる。end_date はグループ共通。
# 空港箱崎と七隈は別グループなので、改正日が路線で異なる場合も該当グループだけを更新すればよい。
#
# Issue #42: 2026/4/1 開始の「ミッドナイト・トレイン」（月〜土の終電延長）に伴い、
# 平日・土曜は 20260401 改正。休日（日曜・祝日）は月〜土が対象のため 4/1 改正の対象外で、
# 従来の路線別改正日（空港箱崎=20260314 / 七隈=20250804）を維持する。
service_groups:
  - id: 空港箱崎
    lines: [空港線, 箱崎線]
    end_date: "99991231"
    start_dates:
      平日: "20260401"   # ミッドナイト・トレイン（2026/4/1 改正）
      土曜: "20260401"
      休日: "20260314"   # 4/1 改正の対象外。従来の改正日を維持
  - id: 七隈
    lines: [七隈線]
    end_date: "99991231"
    start_dates:
      平日: "20260401"
      土曜: "20260401"
      休日: "20250804"

# 祝日は「休日」ダイヤで運行する想定。該当日の通常区分を calendar_dates で除外し、
# 休日区分を追加する（グループごとの service_id に対して行う）。
holiday:
  apply_service: 休日        # 祝日に運行する区分
  use_jpholiday: true        # 日本の祝日を自動算出（jpholiday）
  horizon_years: 2           # 祝日例外を生成する未来上限（end_date が遠い場合の安全上限）
  extra_holiday_dates: []    # 追加で休日扱いする日（年末年始など） 例: ["20261229", "20261230"]
  extra_normal_dates: []     # 祝日でも通常ダイヤに戻す日 例: ["20270101"]
